# ==========================================
# AImportarr Configuration
# ==========================================

general:
  # Global dry-run toggle (set false for live execution, true for simulation only)
  dry_run: false

  # Background local queue sync interval in seconds (default: 30s; instant triggers via Webhooks/Retry)
  check_interval_seconds: 30

  # Minimum cooldown in seconds between AI model calls in the FIFO worker (prevents rate-limit bursts)
  ai_cooldown_seconds: 4.0

  # Minimum AI confidence required to auto-import or delete files (0.0 to 1.0)
  min_confidence: 0.85

  # Low-confidence behavior:
  # false (Conservative default): leave low-confidence items (< min_confidence) in the queue for review
  # true (Hands-Off): dismiss, blocklist, and trigger redownload while preserving seeding (removeFromClient=false)
  reject_on_low_confidence: false

  # Logging level: DEBUG, INFO, WARNING, ERROR
  log_level: "INFO"

# ==========================================
# AI Provider Configuration
# ==========================================
ai:
  # Primary provider: "gemini" or "ollama"
  provider: "gemini"

  # Automatic fallback: if Gemini hits rate limits, invalid key, or token exhaustion,
  # AImportarr will automatically fall back to local Ollama.
  fallback_enabled: true

  # Google Gemini configuration (Cloud / Free Tier)
  gemini:
    api_key: "YOUR_GEMINI_API_KEY"
    model: "auto" # Default: "auto" dynamically resolves the smallest/fastest active model (e.g. flash-lite / flash) and auto-heals on 404s

  # Ollama configuration (Local / Self-hosted)
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:1.5b"

# ==========================================
# *arr Services
# ==========================================
sonarr:
  enabled: true
  url: "http://localhost:8989"
  api_key: "YOUR_SONARR_API_KEY"

radarr:
  enabled: false
  url: "http://localhost:7878"
  api_key: "YOUR_RADARR_API_KEY"

# ==========================================
# Secure Archive Extraction (Replaces Unpackerr)
# ==========================================
# Automatically inspects archive files (.zip, .rar, .7z, .tar) in memory before extracting.
# If malware/executables are detected, immediately deletes from client and blocklists the release.
# If valid media is verified, extracts into a safe sandbox staging folder and imports.
extraction:
  enabled: true
  delete_after_import: true # Clean up extracted video files once imported so disk space isn't duplicated
  staging_suffix: "_extracted"

# ==========================================
# Web UI & Metrics Monitor
# ==========================================
web:
  enabled: true
  host: "0.0.0.0"
  port: 9890

# ==========================================
# SQLite Database & Retention
# ==========================================
database:
  path: "/config/aimportarr.db"
  retention_days: 30

# ==========================================
# Path Mappings (Optional)
# ==========================================
path_mappings: []
#  - from: "/downloads"
#    to: "/data/downloads"
