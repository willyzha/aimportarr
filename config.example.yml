# ==========================================
# AImportarr Configuration
# ==========================================

general:
  # Queue check interval in seconds (default: 120s = 2 minutes)
  check_interval_seconds: 120

  # Minimum AI confidence required to auto-import (0.0 to 1.0)
  min_confidence: 0.85

  # Logging level: DEBUG, INFO, WARNING, ERROR
  log_level: "INFO"

# ==========================================
# AI Provider Configuration
# ==========================================
ai:
  # Primary provider: "gemini" or "ollama"
  provider: "gemini"

  # Automatic fallback: if Gemini hits rate limits, invalid key, or token exhaustion,
  # AImportarr will automatically fall back to local Ollama.
  fallback_enabled: true

  # Google Gemini configuration (Cloud / Free Tier)
  gemini:
    api_key: "YOUR_GEMINI_API_KEY"
    model: "auto" # Default: "auto" dynamically resolves the smallest/fastest active model (e.g. flash-lite / flash) and auto-heals on 404s

  # Ollama configuration (Local / Self-hosted)
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:1.5b"

# ==========================================
# *arr Services
# ==========================================
sonarr:
  enabled: true
  url: "http://localhost:8989"
  api_key: "YOUR_SONARR_API_KEY"

radarr:
  enabled: false
  url: "http://localhost:7878"
  api_key: "YOUR_RADARR_API_KEY"

# ==========================================
# Error & Import Failure Categories
# ==========================================
# Granular control over how specific Sonarr/Radarr issues are handled.
# Each category supports:
#   enabled: true / false (whether AImportarr attempts to resolve this issue)
#   dry_run: true / false (set false to enable real auto-imports, true for simulation only)
categories:
  # 1. Fake or Malware Releases (trojans, scam archives, unsupported executables)
  # Uses AI to verify if an unsupported archive (.7z, .exe) is a scam release,
  # then automatically deletes it from the download client and adds it to the blocklist.
  fake_or_malware:
    enabled: true
    dry_run: false

  # 2. Release was matched to series/movie by ID (Sonarr/Radarr safety guardrail)
  # Uses AI to confirm title matching before approving import.
  id_match:
    enabled: true
    dry_run: false

  # 3. Unknown Series or Movie (item missing from queue metadata)
  # Uses AI to match the release name against all tracked items in your library
  unknown_media:
    enabled: true
    dry_run: true

  # 4. Series is known, but episode could not be parsed ("Unknown Episode")
  # Uses AI to parse season and episode numbers from irregular filenames
  unknown_episode:
    enabled: true
    dry_run: true

  # 5. File flagged as sample, preview, or short video
  # AI evaluates whether the file is disposable or a genuine release (e.g. OVA/special)
  sample_or_extra:
    enabled: true
    dry_run: true

  # 6. Quality cutoff or language profile rejections
  quality_or_language:
    enabled: true
    dry_run: true

  # 7. Expected episodes missing from release (e.g. single episode labeled as a season pack)
  # Automatically imports any available episode files, then dismisses the remaining
  # season pack warning from the queue (without deleting the torrent from your client).
  missing_episodes:
    enabled: true
    dry_run: false

  # 8. Fallback / Catch-All category for any other unclassified queue error or warning
  other:
    enabled: true
    dry_run: true

# ==========================================
# Secure Archive Extraction (Replaces Unpackerr)
# ==========================================
# Automatically inspects archive files (.zip, .rar, .7z, .tar) in memory before extracting.
# If malware/executables are detected, immediately deletes and blocklists the release.
# If valid media is verified, extracts into a safe sandbox staging folder and imports.
# Requires the download directory to be mounted in the AImportarr container.
extraction:
  enabled: true
  delete_after_import: true # Clean up extracted video files once imported so disk space isn't duplicated
  staging_suffix: "_extracted"

# ==========================================
# Web UI & Metrics Monitor
# ==========================================
# Lightweight dashboard to monitor processing history, AI token consumption,
# queue scans, and model analytics in real-time. Accessible via web browser.
web:
  enabled: true
  host: "0.0.0.0"
  port: 9890

# ==========================================
# Path Mappings (Optional)
# ==========================================
# Only needed if Sonarr/Radarr's internal container paths differ from AImportarr's container paths.
# If both containers use the same path (e.g. /data/downloads or /downloads), this can be omitted.
# AImportarr also automatically checks standard mount locations (/data/downloads, /downloads, /data).
path_mappings: []
#  - from: "/downloads"
#    to: "/data/downloads"
