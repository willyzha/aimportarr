name: Build, Test and Publish Container

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Docker Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build local Docker test image
        run: docker build -t aimportarr:test .

      - name: Run container test suite
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/config.example.yml:/app/config.example.yml:ro \
            -v ${{ github.workspace }}/tests:/app/tests:ro \
            aimportarr:test python -m unittest discover -s tests -v

  build-and-push:
    name: Build & Publish Multi-Arch
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-architecture builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') && !contains(github.ref, 'dev') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' || contains(github.ref, 'dev') }}
            type=raw,value=beta,enable=${{ contains(github.ref, 'beta') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') && !contains(github.ref, 'dev')) }}
          labels: |
            org.opencontainers.image.title=AImportarr
            org.opencontainers.image.description=AI-powered queue companion & archive unpacker for Sonarr and Radarr — automatically resolves stuck imports, unpacks archives, and blocklists downgrades or malware.
            org.opencontainers.image.source=https://github.com/willyzha/aimportarr
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'dev') }}
          generate_release_notes: true
